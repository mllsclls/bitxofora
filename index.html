<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitxo Fora · Accés</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="pantalla-login">
  <div class="caixa-login">
    <h1>🐛 Bitxo Fora</h1>
    <p class="subtitol">Registre d'esdeveniments familiar</p>

    <div id="avis-info" class="avis amagat"></div>

    <!-- FORMULARI LOGIN -->
    <form id="form-login">
      <div class="camp">
        <label for="login-email">Correu electrònic</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="camp">
        <label for="login-password">Contrasenya</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <p class="error amagat" id="login-error"></p>
      <button type="submit" class="principal" style="width:100%">Entrar</button>
    </form>

    <p style="text-align:center; color:var(--text-suau); font-size:0.85rem; margin-top:1.2rem;">
      Els comptes nous els crea el superadministrador. Si encara no en tens, demana'l.
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
