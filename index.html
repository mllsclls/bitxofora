<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitxo Fora · Accés</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="pantalla-login">
  <div class="caixa-login">
    <h1>🐛 Bitxo Fora</h1>
    <p class="subtitol">Registre d'esdeveniments familiar</p>

    <div id="avis-info" class="avis amagat"></div>

    <!-- FORMULARI LOGIN -->
    <form id="form-login">
      <div class="camp">
        <label for="login-email">Correu electrònic</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="camp">
        <label for="login-password">Contrasenya</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <p class="error amagat" id="login-error"></p>
      <button type="submit" class="principal" style="width:100%">Entrar</button>
    </form>

    <!-- FORMULARI REGISTRE -->
    <form id="form-registre" class="amagat">
      <div class="camp">
        <label for="reg-nom">Nom</label>
        <input type="text" id="reg-nom" required autocomplete="name">
      </div>
      <div class="camp">
        <label for="reg-email">Correu electrònic</label>
        <input type="email" id="reg-email" required autocomplete="username">
      </div>
      <div class="camp">
        <label for="reg-password">Contrasenya</label>
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
      </div>
      <p class="error amagat" id="reg-error"></p>
      <button type="submit" class="principal" style="width:100%">Crear compte</button>
    </form>

    <div class="canvi-mode">
      <span id="text-canvi-a-registre">Encara no tens compte? <button id="btn-anar-registre">Registra't</button></span>
      <span id="text-canvi-a-login" class="amagat">Ja tens compte? <button id="btn-anar-login">Entra</button></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
